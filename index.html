    <script>
        // Default 20 Teams
        const defaultTeams = [
            { id: 'amp', name: 'Amnesiophobie' },
            { id: 't2', name: 'Suedwestkurve' },
            { id: 't3', name: 'Die Bremer Stadtquizzikanten' },
            { id: 't4', name: 'Federal Bureau of Inquizication' },
            { id: 't5', name: 'AC-Quiz-Grani' },
            { id: 't6', name: 'Quizzy McQuizface' },
            { id: 't7', name: 'Schall & Rauch' },
            { id: 't8', name: 'Qiss me, Kate' },
            { id: 't9', name: 'Ahlenfelders Erben' },
            { id: 't10', name: 'Haute Quizine' },
            { id: 't11', name: 'Quiz-Club Berlin' },
            { id: 't12', name: 'Bavaria Quizzers' },
            { id: 't13', name: 'Rhein-Ruhr Besserwisser' },
            { id: 't14', name: 'Hanseatische Denker' },
            { id: 't15', name: 'Trivia Taktiker' },
            { id: 't16', name: 'Kopf-an-Kopf Quizzer' },
            { id: 't17', name: 'Grip & Verstand' },
            { id: 't18', name: 'Elb-Quizzer' },
            { id: 't19', name: 'Könige der Fragen' },
            { id: 't20', name: 'Mind-Games e.V.' }
        ];

        const fixedSchedule = {
            1: [
                ['amp', 't2'], ['t3', 't4'], ['t5', 't6'], ['t7', 't8'], ['t9', 't10'],
                ['t11', 't12'], ['t13', 't14'], ['t15', 't16'], ['t17', 't18'], ['t19', 't20']
            ],
            2: [
                ['amp', 't3'], ['t2', 't4'], ['t5', 't7'], ['t6', 't8'], ['t9', 't11'],
                ['t10', 't12'], ['t13', 't15'], ['t14', 't16'], ['t17', 't19'], ['t18', 't20']
            ],
            3: [
                ['amp', 't4'], ['t2', 't3'], ['t5', 't8'], ['t6', 't7'], ['t9', 't12'],
                ['t10', 't11'], ['t13', 't16'], ['t14', 't15'], ['t17', 't20'], ['t18', 't19']
            ]
        };
        let state = {
            round: 1,
            teams: [],
            completedRounds: [],
            currentPairings: []
        };

        const GITHUB_JSON_URL = 'https://raw.githubusercontent.com/McNutty1/DQVOL2027Swiss/refs/heads/main/Schweizer_System.json';

        function showConfirm(title, message, onConfirm, isAlertOnly = false) {
            document.getElementById('confirm-title').innerText = title;
            document.getElementById('confirm-message').innerText = message;
            const modal = document.getElementById('confirm-modal');
            modal.classList.remove('hidden');

            const okBtn = document.getElementById('confirm-ok-btn');
            const cancelBtn = document.getElementById('confirm-cancel-btn');

            const newOkBtn = okBtn.cloneNode(true);
            const newCancelBtn = cancelBtn.cloneNode(true);
            okBtn.parentNode.replaceChild(newOkBtn, okBtn);
            cancelBtn.parentNode.replaceChild(newCancelBtn, cancelBtn);

            if (isAlertOnly) {
                newCancelBtn.classList.add('hidden');
                newOkBtn.innerText = 'OK';
            } else {
                newCancelBtn.classList.remove('hidden');
                newOkBtn.innerText = 'Bestätigen';
            }

            newOkBtn.onclick = function() {
                modal.classList.add('hidden');
                if (onConfirm) onConfirm();
            };
            newCancelBtn.onclick = function() {
                modal.classList.add('hidden');
            };
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.toggle('dark');
            localStorage.setItem('theme', isDark ? 'dark' : 'light');
            if (window.lucide) lucide.createIcons();
        }

        async function initTournament() {
            try {
                const response = await fetch(GITHUB_JSON_URL + '?t=' + Date.now());
                if (response.ok) {
                    const fetchedState = await response.json();
                    if (fetchedState.teams && fetchedState.completedRounds) {
                        state = fetchedState;
                        saveStateToStorage();
                        renderAll();
                        return;
                    }
                }
            } catch (err) {
                console.warn('Lokalmodus aktiv:', err);
            }

            const saved = localStorage.getItem('swiss_tournament_state');
            if (saved) {
                try {
                    state = JSON.parse(saved);
                } catch(e) {
                    setupDefaultState();
                }
            } else {
                setupDefaultState();
            }
            renderAll();
        }

        function setupDefaultState() {
            state = {
                round: 1,
                teams: JSON.parse(JSON.stringify(defaultTeams)),
                completedRounds: [],
                currentPairings: []
            };
            generatePairingsForCurrentRound();
            saveStateToStorage();
        }

        function saveStateToStorage() {
            localStorage.setItem('swiss_tournament_state', JSON.stringify(state));
        }

        function resetTournament() {
            showConfirm(
                "Turnier zurücksetzen",
                "Möchtest du das gesamte Turnier wirklich zurücksetzen? Alle bisherigen Ergebnisse gehen verloren.",
                function() {
                    setupDefaultState();
                    renderAll();
                }
            );
        }

        function getPointsFromResult(result) {
            switch(result) {
                case 'home_win': return { homeP: 4, awayP: 0 };
                case 'home_close': return { homeP: 4, awayP: 1 };
                case 'draw': return { homeP: 2, awayP: 2 };
                case 'away_close': return { homeP: 1, awayP: 4 };
                case 'away_win': return { homeP: 0, awayP: 4 };
                default: return { homeP: 0, awayP: 0 };
            }
        }

        function calculateStandings() {
            const map = {};
            state.teams.forEach(t => {
                map[t.id] = {
                    ...t,
                    played: 0,
                    points: 0,
                    score: 0,
                    opponents: [],
                    bhz: 0,
                    fbhz: 0
                };
            });

            state.completedRounds.forEach(r => {
                r.matches.forEach(m => {
                    if (m.result !== 'none') {
                        const { homeP, awayP } = getPointsFromResult(m.result);
                        map[m.home].points += homeP;
                        map[m.away].points += awayP;
                        map[m.home].score += parseInt(m.homeAddScore || 0);
                        map[m.away].score += parseInt(m.awayAddScore || 0);
                        map[m.home].played += 1;
                        map[m.away].played += 1;
                        map[m.home].opponents.push(m.away);
                        map[m.away].opponents.push(m.home);
                    }
                });
            });

            Object.keys(map).forEach(id => {
                map[id].bhz = map[id].opponents.reduce((sum, oppId) => sum + (map[oppId] ? map[oppId].points : 0), 0);
            });

            Object.keys(map).forEach(id => {
                map[id].fbhz = map[id].opponents.reduce((sum, oppId) => sum + (map[oppId] ? map[oppId].bhz : 0), 0);
            });

            const standings = Object.values(map);

            standings.sort((a, b) => {
                if (b.points !== a.points) return b.points - a.points;
                if (b.score !== a.score) return b.score - a.score;
                if (b.bhz !== a.bhz) return b.bhz - a.bhz;
                if (b.fbhz !== a.fbhz) return b.fbhz - a.fbhz;
                return a.name.localeCompare(b.name);
            });

            return standings;
        }

        function generatePairingsForCurrentRound() {
            if (fixedSchedule[state.round]) {
                state.currentPairings = fixedSchedule[state.round].map((pair, idx) => ({
                    id: `r${state.round}_m${idx + 1}`,
                    home: pair[0],
                    away: pair[1],
                    result: 'none',
                    homeAddScore: 0,
                    awayAddScore: 0
                }));
            } else {
                generateSwissPairings();
            }
        }
        function generateSwissPairings() {
            const standings = calculateStandings();
            const playedHistory = {};
            state.teams.forEach(t => playedHistory[t.id] = new Set());
            
            state.completedRounds.forEach(r => {
                r.matches.forEach(m => {
                    playedHistory[m.home].add(m.away);
                    playedHistory[m.away].add(m.home);
                });
            });

            const unassigned = [...standings];
            const newPairings = [];

            while (unassigned.length > 0) {
                const teamA = unassigned.shift();
                let opponentIndex = -1;

                for (let i = 0; i < unassigned.length; i++) {
                    const candidate = unassigned[i];
                    if (!playedHistory[teamA.id].has(candidate.id)) {
                        opponentIndex = i;
                        break;
                    }
                }

                if (opponentIndex === -1 && unassigned.length > 0) {
                    opponentIndex = 0;
                }

                if (opponentIndex !== -1) {
                    const teamB = unassigned.splice(opponentIndex, 1)[0];
                    newPairings.push({
                        id: `r${state.round}_m${newPairings.length + 1}`,
                        home: teamA.id,
                        away: teamB.id,
                        result: 'none',
                        homeAddScore: 0,
                        awayAddScore: 0
                    });
                }
            }

            state.currentPairings = newPairings;
        }

        function renderTable() {
            const standings = calculateStandings();
            const tbody = document.getElementById('league-table-body');
            tbody.innerHTML = '';

            standings.forEach((team, idx) => {
                const rank = idx + 1;
                const leagueNumber = Math.floor(idx / 2) + 1;
                const isGroupEnd = rank % 2 === 0 && rank < standings.length;

                const borderClass = isGroupEnd 
                    ? 'border-b-2 border-slate-400 dark:border-slate-600' 
                    : 'border-b border-slate-100 dark:border-slate-800/60';

                // Hervorhebung für das Team Amnesiophobie
                const isHighlighted = team.id === 'amp' || team.name.toLowerCase().includes('amnesiophobie');
                const rowBgClass = isHighlighted
                    ? 'bg-sky-50/90 dark:bg-sky-950/50 hover:bg-sky-100/80 dark:hover:bg-sky-900/50'
                    : 'hover:bg-slate-50 dark:hover:bg-slate-800/50';
                const tr = document.createElement('tr');
                tr.className = `${borderClass} ${rowBgClass} transition text-slate-700 dark:text-slate-300`;
                tr.innerHTML = `
                    <td class="py-2.5 px-3 text-center font-semibold text-xs">
                        <div class="flex items-center justify-center gap-1.5">
                            <span class="${rank <= 2 ? 'text-amber-600 dark:text-amber-400 font-bold' : 'text-slate-600 dark:text-slate-400'}">${rank}</span>
                            <span class="text-[10px] text-slate-400 font-normal">L${leagueNumber}</span>
                        </div>
                    </td>					 
                    <td class="py-2.5 px-3 ${isHighlighted ? 'font-bold text-sky-900 dark:text-sky-200' : 'font-medium text-slate-900 dark:text-white'}">${team.name}</td>
                    <td class="py-2.5 px-2 text-center font-mono text-slate-600 dark:text-slate-400">${team.played}</td>
                    <td class="py-2.5 px-3 text-right font-mono text-slate-600 dark:text-slate-400">${team.score}</td>
                    <td class="py-2.5 px-3 text-right font-mono text-slate-400">${team.bhz}</td>
                    <td class="py-2.5 px-3 text-right font-mono text-slate-400">${team.fbhz}</td>
                    <td class="py-2.5 px-4 text-right font-bold font-mono text-sky-600 dark:text-sky-400 text-sm">${team.points}</td>
                `;
                tbody.appendChild(tr);
            });

            document.getElementById('round-badge').innerText = `Runde ${state.round}`;
            document.getElementById('current-round-title').innerText = `Paarungen Runde ${state.round}`;
const modeBadge = document.getElementById('pairing-mode-badge');
            if (modeBadge) {
                // Prüfen, ob die Runde bereits fest in den absolvierten Runden liegt oder fix im Schedule steht
                const isCompleted = state.completedRounds.some(r => r.round === Number(state.round));
                const isFixed = Number(state.round) <= 3 && Boolean(fixedSchedule[state.round]);

                let badgeText = 'Simuliert';
                let badgeClass = 'text-[10px] font-medium px-1.5 py-0.5 rounded bg-amber-50 dark:bg-amber-950/60 text-amber-600 dark:text-amber-400 border border-amber-200 dark:border-amber-800/60';

                if (isCompleted || isFixed) {
                    if (Number(state.round) <= 3) {
                        badgeText = 'Fester Spieltag';
                        badgeClass = 'text-[10px] font-medium px-1.5 py-0.5 rounded bg-slate-100 dark:bg-slate-800 text-slate-500 border border-slate-200 dark:border-slate-700';
                    } else {
                        badgeText = 'Schweizer System';
                        badgeClass = 'text-[10px] font-medium px-1.5 py-0.5 rounded bg-indigo-50 dark:bg-indigo-950/60 text-indigo-600 dark:text-indigo-400 border border-indigo-200 dark:border-indigo-800/60';
                    }
                }

                modeBadge.innerText = badgeText;
                modeBadge.className = badgeClass;
            }			 
        }

function renderFixtures() {
            const container = document.getElementById('current-fixtures-container');
            if (!container) return;
            container.innerHTML = '';

            const isTargetTeam = (teamId) => {
                if (teamId === 'amp') return true;
                const t = state.teams.find(team => team.id === teamId);
                return t ? t.name.toLowerCase().includes('amnesiophob') : false;
            };

            const resultOptions = [
                { key: 'home_win', label: '4:0' },
                { key: 'home_close', label: '4:1' },
                { key: 'draw', label: '2:2' },
                { key: 'away_close', label: '1:4' },
                { key: 'away_win', label: '0:4' }
            ];

            // Paarung mit Amnesiophobie immer nach oben sortieren
            const sortedPairings = [...state.currentPairings].sort((a, b) => {
                const aHasTarget = isTargetTeam(a.home) || isTargetTeam(a.away);
                const bHasTarget = isTargetTeam(b.home) || isTargetTeam(b.away);
                if (aHasTarget && !bHasTarget) return -1;
                if (!aHasTarget && bHasTarget) return 1;
                return 0;
            });

            sortedPairings.forEach(m => {
                const homeTeam = state.teams.find(t => t.id === m.home) || { name: m.home || 'Unbekannt' };
                const awayTeam = state.teams.find(t => t.id === m.away) || { name: m.away || 'Unbekannt' };
                const isTargetMatch = isTargetTeam(m.home) || isTargetTeam(m.away);

                const row = document.createElement('div');
                row.className = `p-4 transition-colors ${isTargetMatch ? 'bg-sky-50/90 dark:bg-sky-950/50 hover:bg-sky-100/80 dark:hover:bg-sky-900/50' : 'hover:bg-slate-50/60 dark:hover:bg-slate-800/30'}`;

                const buttonsHtml = resultOptions.map(opt => {
                    const isActive = m.result === opt.key;
                    const activeClass = isActive
                        ? 'bg-slate-600 dark:bg-slate-100 text-white dark:text-slate-900 font-bold border-slate-600 dark:border-slate-100 shadow-xs'
                        : 'bg-white dark:bg-slate-900 text-slate-600 dark:text-slate-400 border-slate-200 dark:border-slate-800 hover:border-slate-300 dark:hover:border-slate-700 hover:text-slate-900 dark:hover:text-slate-200';
                    
                    return `
                        <button type="button" onclick="setMatchResult('${m.id}', '${opt.key}')"
                            class="py-1.5 rounded text-[11px] font-mono border transition-all cursor-pointer ${activeClass}">
                            ${opt.label}
                        </button>
                    `;
                }).join('');

                row.innerHTML = `
                    <!-- Teams Zeile -->
                    <div class="flex items-center justify-between gap-2 mb-3">
                        <div class="flex-1 min-w-0">
                            <span class="text-xs sm:text-[13px] truncate block ${isTargetTeam(m.home) ? 'font-bold text-sky-900 dark:text-sky-200' : 'font-semibold text-slate-800 dark:text-slate-200'}">
                                ${homeTeam.name}
                            </span>
                        </div>
                        <span class="text-[11px] font-mono text-slate-400 px-1.5">vs.</span>
                        <div class="flex-1 min-w-0 text-right">
                            <span class="text-xs sm:text-[13px] truncate block ${isTargetTeam(m.away) ? 'font-bold text-sky-900 dark:text-sky-200' : 'font-semibold text-slate-800 dark:text-slate-200'}">
                                ${awayTeam.name}
                            </span>
                        </div>
                    </div>

                    <!-- Segmented Result Selector + Score Inputs nebeneinander -->
                    <div class="flex items-center gap-3">
                        <div class="grid grid-cols-5 gap-1 flex-1">
                            ${buttonsHtml}
                        </div>

                        <!-- Kompakte Score-Eingabe rechts -->
                        <div class="flex items-center gap-1 pl-2 border-l border-slate-200 dark:border-slate-800" title="Zusätzlicher Quiz-Score (optional)">
                            <input type="number" min="0" placeholder="–" value="${m.homeAddScore || ''}"
                                onchange="setMatchScore('${m.id}', 'home', this.value)"
                                class="w-9 h-7 rounded bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center font-mono text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:border-sky-500">
                            <span class="text-slate-400 text-xs">:</span>
                            <input type="number" min="0" placeholder="–" value="${m.awayAddScore || ''}"
                                onchange="setMatchScore('${m.id}', 'away', this.value)"
                                class="w-9 h-7 rounded bg-slate-50 dark:bg-slate-900 border border-slate-200 dark:border-slate-800 text-center font-mono text-xs font-medium text-slate-800 dark:text-slate-200 focus:outline-none focus:border-sky-500">
                        </div>
                    </div>
                `;
                container.appendChild(row);
            });
        }

        function renderHistory() {
            const container = document.getElementById('rounds-history-container');
            if (state.completedRounds.length === 0) {
                container.innerHTML = '<p class="text-slate-400 italic">Noch keine absolvierten Runden vorhanden.</p>';
                return;
            }

            container.innerHTML = '';
            state.completedRounds.slice().reverse().forEach(r => {
                const details = document.createElement('details');
                details.className = "bg-slate-50/50 dark:bg-slate-950/40 border border-slate-200 dark:border-slate-800 rounded-lg p-2.5";
                
                let matchesHtml = r.matches.map(m => {
                    const h = (state.teams.find(t => t.id === m.home) || { name: m.home }).name;
                    const a = (state.teams.find(t => t.id === m.away) || { name: m.away }).name;
                    const pts = getPointsFromResult(m.result);
                    return `<div class="flex justify-between py-1 border-b border-slate-100 dark:border-slate-800/40 last:border-0 text-slate-600 dark:text-slate-400"><span>${h} vs ${a}</span><span class="font-mono font-medium text-slate-800 dark:text-slate-200">${pts.homeP}:${pts.awayP} <span class="text-slate-400 text-[10px]">(${m.homeAddScore}:${m.awayAddScore})</span></span></div>`;
                }).join('');

                details.innerHTML = `<summary class="font-medium cursor-pointer text-slate-700 dark:text-slate-300">Runde ${r.round}</summary><div class="mt-2 pt-2 border-t border-slate-200 dark:border-slate-800 space-y-0.5">${matchesHtml}</div>`;
                container.appendChild(details);
            });
        }

        function renderAll() {
            renderTable();
            renderFixtures();
            renderHistory();
            if (window.lucide) lucide.createIcons();
        }

        function setMatchResult(matchId, type) {
            const m = state.currentPairings.find(x => x.id === matchId);
            if (m) {
                m.result = m.result === type ? 'none' : type;
            }
            const select = document.getElementById('round-preset-select');
            if (select) select.value = '';
            renderFixtures();
            saveStateToStorage();
        }

        function setMatchScore(matchId, side, val) {
            const m = state.currentPairings.find(x => x.id === matchId);
            if (m) {
                const num = parseInt(val) || 0;
                if (side === 'home') m.homeAddScore = num;
                if (side === 'away') m.awayAddScore = num;
            }
            saveStateToStorage();
        }

        function applyRoundPreset(mode) {
            if (!mode) return;

            const standings = calculateStandings();
            const statsMap = {};
            standings.forEach((t, idx) => {
                statsMap[t.id] = { score: t.score, points: t.points, rank: idx + 1 };
            });

            const isTarget = (id) => {
                if (id === 'amp') return true;
                const t = state.teams.find(x => x.id === id);
                return t ? t.name.toLowerCase().includes('amnesiophob') : false;
            };

            const ampEntry = standings.find(t => isTarget(t.id));
            const ampRank = ampEntry ? statsMap[ampEntry.id].rank : 1;

            // Hilfsfunktion zur realistischen Score-Generierung passend zum Ergebnis
            const assignConsistentScores = (m) => {
                if (m.result === 'draw') {
                    const s = Math.floor(Math.random() * 14) + 28;
                    m.homeAddScore = s;
                    m.awayAddScore = s;
                } else if (m.result === 'home_close') {
                    m.homeAddScore = Math.floor(Math.random() * 12) + 33;
                    m.awayAddScore = m.homeAddScore - (Math.floor(Math.random() * 4) + 1);
                } else if (m.result === 'home_win') {
                    m.homeAddScore = Math.floor(Math.random() * 12) + 35;
                    m.awayAddScore = Math.max(12, m.homeAddScore - (Math.floor(Math.random() * 8) + 5));
                } else if (m.result === 'away_close') {
                    m.awayAddScore = Math.floor(Math.random() * 12) + 33;
                    m.homeAddScore = m.awayAddScore - (Math.floor(Math.random() * 4) + 1);
                } else if (m.result === 'away_win') {
                    m.awayAddScore = Math.floor(Math.random() * 12) + 35;
                    m.homeAddScore = Math.max(12, m.awayAddScore - (Math.floor(Math.random() * 8) + 5));
                }
            };

            if (mode === 'random') {
                const results = ['home_win', 'home_close', 'draw', 'away_close', 'away_win'];
                state.currentPairings.forEach(m => {
                    m.result = results[Math.floor(Math.random() * results.length)];
                    assignConsistentScores(m);
                });
            } else if (mode === 'favorites') {
                // Durchschnittlicher Score pro Runde als Maßstab für knappen vs. deutlichen Sieg
                const roundsPlayed = Math.max(1, state.completedRounds.length);
                state.currentPairings.forEach(m => {
                    const hScore = statsMap[m.home]?.score || 0;
                    const aScore = statsMap[m.away]?.score || 0;
                    const avgDiff = Math.abs(hScore - aScore) / roundsPlayed;

                    if (hScore === aScore) {
                        m.result = 'draw';
                    } else if (hScore > aScore) {
                        m.result = avgDiff >= 4 ? 'home_win' : 'home_close';
                    } else {
                        m.result = avgDiff >= 4 ? 'away_win' : 'away_close';
                    }
                    assignConsistentScores(m);
                });
            } else if (mode === 'worst-case') {
                // Amnesiophobie verliert hoch (0 Punkte), direkte Tabellennachbarn gewinnen
                state.currentPairings.forEach(m => {
                    const hIsAmp = isTarget(m.home);
                    const aIsAmp = isTarget(m.away);

                    if (hIsAmp) {
                        m.result = 'away_win';
                    } else if (aIsAmp) {
                        m.result = 'home_win';
                    } else {
                        const hRank = statsMap[m.home]?.rank || 99;
                        const aRank = statsMap[m.away]?.rank || 99;
                        const hNearAmp = Math.abs(hRank - ampRank) <= 4;
                        const aNearAmp = Math.abs(aRank - ampRank) <= 4;

                        if (hNearAmp && !aNearAmp) {
                            m.result = 'home_win';
                        } else if (aNearAmp && !hNearAmp) {
                            m.result = 'away_win';
                        } else {
                            // Wenn beide oder keiner in direkter Nähe: Besser platziertes Team gewinnt
                            m.result = hRank <= aRank ? 'home_win' : 'away_win';
                        }
                    }
                    assignConsistentScores(m);
                });
            }

            renderFixtures();
            saveStateToStorage();
        }

        function finishCurrentRound() {
            const advanceRound = () => {
                state.completedRounds.push({
                    round: state.round,
                    matches: JSON.parse(JSON.stringify(state.currentPairings))
                });

                state.round += 1;
                generatePairingsForCurrentRound();
                const select = document.getElementById('round-preset-select');
                if (select) select.value = '';
                saveStateToStorage();
                renderAll();
            };

            const unplayed = state.currentPairings.some(m => m.result === 'none');																				  
            if (unplayed) {
                showConfirm(
                    "Runde unvollständig",
                    "Einige Duelle haben noch kein Ergebnis. Trotzdem die Runde abschließen (unvollständige Spiele werden 0:0 gewertet)?",
                    advanceRound
                );
                return;
							   
            }

            advanceRound();					   
        }

        function openTeamManager() {
            const container = document.getElementById('team-list-inputs');
            container.innerHTML = '';
            state.teams.forEach((t, i) => {
                const div = document.createElement('div');
                div.className = "flex items-center gap-2";
                div.innerHTML = `
                    <span class="text-xs font-mono text-slate-400 w-6">${i+1}.</span>
                    <input type="text" data-id="${t.id}" value="${t.name}" class="team-name-input flex-1 bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 rounded-lg px-2.5 py-1 text-xs font-medium text-slate-800 dark:text-slate-100">
                `;
                container.appendChild(div);
            });
            document.getElementById('team-modal').classList.remove('hidden');
        }

        function closeTeamManager() {
            document.getElementById('team-modal').classList.add('hidden');
        }

        function saveTeamsFromManager() {
            const inputs = document.querySelectorAll('.team-name-input');
            inputs.forEach(input => {
                const id = input.getAttribute('data-id');
                const t = state.teams.find(x => x.id === id);
                if (t && input.value.trim() !== '') {
                    t.name = input.value.trim();
                }
            });
            saveStateToStorage();
            closeTeamManager();
            renderAll();
        }

        function exportState() {
            const jsonStr = JSON.stringify(state, null, 2);
            const blob = new Blob([jsonStr], { type: 'application/json' });
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = `Schweizer_System.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importStatePrompt() {
            const input = document.createElement('input');
            input.type = 'file';
            input.accept = 'application/json';
            input.onchange = e => {
                const file = e.target.files[0];
                if (file) {
                    const reader = new FileReader();
                    reader.onload = event => {
                        try {
                            const imported = JSON.parse(event.target.result);
                            if (imported.teams && imported.completedRounds) {
                                state = imported;
                                saveStateToStorage();
                                renderAll();
                            } else {
                                showConfirm("Fehler beim Import", "Ungültiges Dateiformat!", null, true);
                            }
                        } catch(err) {
                            showConfirm("Fehler beim Import", "Fehler beim Lesen der Datei!", null, true);
                        }
                    };
                    reader.readAsText(file);
                }
            };
            input.click();
        }

        window.onload = function() {
            initTournament();
        };
    </script>
</body>
</html>
